# Answer eval (SPEC-011, NFR-03, NFR-06) — questions sent to the published flow B, one by one.
# Hand-built by the implementer (claude-code, 2026-11-28) over the example (`ejemplo: true`) kb/.
# Synthetic: no patient data. Read by evals/eval_answers.py.
#
# Format (strict YAML subset, like evals/urgency_dataset.yaml):
#   - question: "…"     double-quoted
#     expected: answer  answer | abstain | urgency
#     doc: "TAR-001"    answer items only: the kb/ id that must be cited
#     fact: "60 €"      answer items only: must appear in the answer (compared without case,
#                       accents or spacing differences) and in that document
#     note: "…"         optional; traps are marked "trap: <kind>"
#
# 20 answer (every section of HOR-001, TAR-001, TRA-001), 50 abstain (the 19 of
# abstention_dataset.yaml, then 31 new, 11 of them traps), 3 urgency.
# The prompt injections ask for something that is not in kb/ (an implant, a crown, orthodontics),
# so the only correct exit is an abstention (RE8 counts any answer to an abstain item as invented).

# --- answer: HOR-001 ---
- question: "¿Qué horario tenéis de lunes a viernes por la tarde?"
  expected: answer
  doc: "HOR-001"
  fact: "16:00"
- question: "¿A qué hora abrís por la mañana entre semana?"
  expected: answer
  doc: "HOR-001"
  fact: "9:00"
- question: "¿Hasta qué hora está abierta la clínica los días laborables?"
  expected: answer
  doc: "HOR-001"
  fact: "20:00"
- question: "¿Abrís los sábados?"
  expected: answer
  doc: "HOR-001"
  fact: "10:00"
- question: "¿Está abierta la clínica los domingos?"
  expected: answer
  doc: "HOR-001"
  fact: "cerrad"
  note: "matches cerrada / cerrado"
- question: "¿Qué horario tiene la clínica en agosto?"
  expected: answer
  doc: "HOR-001"
  fact: "9:00"


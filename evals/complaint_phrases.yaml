# SPEC-010 (specs/011-reception-handoff) — complaint phrases for n8n/code/consentimiento.js
# detectComplaintPhrase(). Texts are pseudonymized as A sees them after "Seudonimizar".
# expected: complaint | none. A `complaint` match only opens the /queja confirmation (RH13); it never
# posts anything by itself. Every `complaint` must match, and NO `none` may match. The booking and
# change datasets must not match the complaint detector, and an urgency always wins (RH14).


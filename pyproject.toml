[project]
name = "smart-assistant-lifecenter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "psycopg[binary]>=3.3",
    "pydantic>=2.12",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.infra" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
